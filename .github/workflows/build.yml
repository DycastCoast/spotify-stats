# Every push to main builds the container image and pushes it to
# ghcr.io/dycastcoast/spotify-stats:latest. Then: kubectl rollout restart deployment/spotify-stats -n dycast
name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:          # also a "Run workflow" button on the Actions tab

permissions:
  contents: read
  packages: write             # allowed to push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3        # lets a normal PC build for the Pis' arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/dycastcoast/spotify-stats:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
